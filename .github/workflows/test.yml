name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh dash fish fzf

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install dash fish fzf

      - name: Run test suite
        run: zsh tests/run.zsh

  shellcheck:
    name: ShellCheck (install.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the POSIX installer
        run: shellcheck --shell=sh install.sh

  release:
    needs: [test, shellcheck]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          [ "$(cat VERSION)" = "$TAG" ] || { echo "VERSION ($(cat VERSION)) != tag ($TAG)"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk -v v="## ${TAG#v}" '$0 ~ "^"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "oh-my-bd $TAG" --notes-file notes.md
